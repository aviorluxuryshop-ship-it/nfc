const eo3=x=>1-Math.pow(1-x,3),eo4=x=>1-Math.pow(1-x,4);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eoB=x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const rnd=(s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296})(4242);

const fmt=(n,d=0)=>{const s=n.toFixed(d).split('.');s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return s.join(',')};

const rev=(el,p)=>{el.style.transform=`translateY(${(1-eo4(p))*115}%)`};

function fx(sc,lt,dur){const inn=eo4(seg(lt,0,.7)),out=eio(seg(lt,dur-.38,dur));

function hook(t){const sc=$('hook'),dur=S0;sc.style.display=t<dur+.05?'block':'none';if(t>=dur+.05)return;fx(sc,t,dur);
  $('htag').style.opacity=eo3(seg(t,.1,.7));
  const p=eoB(seg(t,.2,.9));$('htoast').style.opacity=clamp(p*2)*(1-eo3(seg(t,1.7,2.1)));$('htoast').style.transform=`translateY(${(1-p)*-90}px) scale(${.92+.08*p})`;
  sc.querySelectorAll('.ttl .l').forEach((el,i)=>{rev(el,seg(t,1.0+i*.24,1.9+i*.24));if(el.classList.contains('gt'))shimmer(el,t)});
}

function stepScene(i,t){const s0=S0+i*SD,lt=t-s0,sc=$('st'+i);const on=lt>-.02&&lt<SD+.02;sc.style.display=on?'block':'none';if(!on)return;
  fx(sc,lt,SD);
  sc.querySelectorAll('.prog i b').forEach((b,j)=>{b.style.transform=`scaleX(${j<i?1:j==i?clamp(lt/SD):0})`});
  pop(sc.querySelector('.pill'),seg(lt,.3,.9),24);
  sc.querySelectorAll('.stitle .l').forEach(el=>rev(el,seg(lt,.45,1.2)));sc.querySelectorAll('.stitle .gt').forEach(el=>shimmer(el,t));
  const d=sc.querySelector('.dd');const dp=eo3(seg(lt,.9,1.6));d.style.opacity=dp;d.style.transform=`translateY(${(1-dp)*20}px)`;
  UP[i](sc,lt);
}
